name: update-profile-art

on:
  schedule:
    # Weekly refresh (Sunday 00:17 UTC) of real contribution data + artwork.
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data
        run: python scripts/fetch_contributions.py

      - name: Render profile artwork
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_ai_terminal.py
          python scripts/make_ml_pipeline.py
          python scripts/make_info_card.py

      - name: Commit generated artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): refresh contribution artwork [skip ci]"
          file_pattern: "data/contributions.json ai-terminal.svg ml-pipeline.svg info-card.svg contrib-heatmap.svg"
          skip_dirty_check: true